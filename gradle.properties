# Global settings for the Gradle build itself (not the app) — read by every
# Gradle invocation in this project, whether from Android Studio or gradlew.

# Give Gradle's own JVM up to 2GB of heap memory, and force UTF-8 file
# encoding everywhere (avoids subtle bugs on machines whose OS default
# encoding isn't UTF-8).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the modern AndroidX support libraries (androidx.* packages) instead of
# the old, now-discontinued "android.support.*" ones. Virtually all modern
# Android projects need this set to true.
android.useAndroidX=true

# Makes each module's generated R class contain ONLY that module's own
# resources, instead of also inheriting every dependency's resources too —
# faster builds and clearer errors when a resource reference is wrong.
android.nonTransitiveRClass=true

# Use Kotlin's official recommended code formatting style.
kotlin.code.style=official
